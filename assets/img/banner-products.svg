<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="100%" stop-color="#e2f4ff"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <g opacity="0.35" filter="url(#soft)">
    <circle cx="220" cy="120" r="110" fill="#10b981"/>
    <circle cx="430" cy="210" r="140" fill="#10b981"/>
    <circle cx="1260" cy="140" r="160" fill="#10b981"/>
    <circle cx="1350" cy="280" r="110" fill="#10b981"/>
    <circle cx="260" cy="360" r="160" fill="#10b981"/>
  </g>
  <g>
    <text x="90" y="220" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="64" font-weight="800" fill="#0b1b14">Our Color Range</text>
    <text x="90" y="280" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="28" font-weight="500" fill="#0b1b14" opacity="0.92">Red • Pink • Green • Yellow — dry & liquid options.</text>
    <rect x="90" y="315" width="270" height="10" rx="5" fill="#0b1b14" opacity="0.18"/>
  </g>
  <g opacity="0.95">
    <rect x="1020" y="115" width="490" height="290" rx="26" fill="rgba(255,255,255,0.75)"/>
    <text x="1060" y="175" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" font-weight="700" fill="#0b1b14">100% Organic • No Chemicals</text>
    <text x="1060" y="215" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="18" font-weight="500" fill="#0b1b14" opacity="0.85">Made from flowers, fruits, leaves</text>
    <text x="1060" y="255" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="18" font-weight="500" fill="#0b1b14" opacity="0.85">Two types: Dry Dust & Liquid</text>
    <g transform="translate(1060, 285)">
      <rect width="170" height="46" rx="14" fill="#0b1b14"/>
      <text x="26" y="30" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="16" font-weight="700" fill="#ffffff">Shop Colors</text>
    </g>
  </g>
</svg>